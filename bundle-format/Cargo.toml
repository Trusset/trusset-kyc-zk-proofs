[package]
name = "trusset-bundle-format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared bundle primitives consumed by both prover and verifier: leaf hash construction (spec §7), sorted Rescue Merkle root, manifest schema with sentinel-signing helper, and ed25519 signature verification. WASM-compatible."

[dependencies]
trusset-circuits-common = { path = "../circuits/common" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", default-features = false }

[lints]
workspace = true
